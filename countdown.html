<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epilogue</title>
    <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;1,500&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #FDFBF7; /* Creamy paper background */
            color: #2C3E50;
            font-family: 'Cormorant Garamond', serif;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            cursor: pointer;
            overflow: hidden; /* Important for containing the falling particles */
            padding: 20px;
            position: relative;
        }

        /* --- The Wax Seal (Initial State) --- */
        .wax-seal-container {
            display: block;
            animation: pulse 3s infinite ease-in-out;
            z-index: 10; /* Ensure it's above everything else initially */
        }

        .wax-seal {
            width: 90px;
            height: 90px;
            background: radial-gradient(circle at 30% 30%, #C0392B, #922B21); /* Richer gradient */
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #5D1009;
            font-family: 'Cormorant Garamond', serif;
            font-weight: bold;
            font-size: 1.4rem;
            box-shadow: 0 6px 15px rgba(0,0,0,0.3), inset 0 2px 5px rgba(255,255,255,0.2);
            border: 4px double #7B241C;
        }

        .tap-text {
            margin-top: 25px;
            font-size: 0.9rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #888;
            font-weight: 500;
        }

        /* --- The Hidden Content --- */
        .hidden-content {
            display: none;
            opacity: 0;
            max-width: 600px;
            z-index: 5; /* Text sits above the falling particles */
            position: relative;
        }

        /* The Script Quote */
        .quote {
            font-family: 'Pinyon Script', cursive;
            font-size: 3.2rem;
            font-weight: 400;
            line-height: 1.2;
            margin-bottom: 25px;
            color: #1a1a1a;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        /* The Blessing */
        .blessing {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.3rem;
            font-style: italic;
            color: #555;
            margin-bottom: 45px;
        }

        /* The Signature */
        .signature {
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #999;
            border-top: 1px solid #e0e0e0;
            display: inline-block;
            padding-top: 25px;
        }


        .afar-line {
            font-family: 'Pinyon Script', cursive;
            font-size: 0.45rem;
            color: #444;
            opacity: 0.85;
        
            position: absolute;
            bottom: 1mm;     /* distance to bottom */
            left: 50%;
            transform: translateX(-50%);
        
            width: 100%;
            text-align: center;
            pointer-events: none; /* avoid interfering with click */
        } 
        
        /* --- The Gold Dust Particles --- */
        .particle {
            position: fixed;
            top: -10px;
            background: #D4AF37; /* Antique Gold color */
            border-radius: 50%;
            box-shadow: 0 0 6px #D4AF37; /* Subtle glow */
            pointer-events: none; /* Ensures they don't interfere with clicks */
            z-index: 1; /* Behind the text */
        }

        /* --- Animations --- */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes revealText {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Animation for falling dust */
        @keyframes fall-and-drift {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% { opacity: 1; }
            100% {
                /* Fall down to 110vh and drift sideways randomly */
                transform: translateY(110vh) translateX(var(--drift));
                opacity: 0;
            }
        }
    </style>
</head>
<body onclick="revealMessage()">

    <div class="wax-seal-container" id="seal">
        <div class="wax-seal">Z</div>
        <div class="tap-text">Tap to Open</div>
    </div>

    <div class="hidden-content" id="message">
        
        <div class="quote">
            "It is not what we think or feel that make us happy, but what we do."
        </div>

        <div class="blessing">
            Wishing you every happiness, today and always.
        </div>

        <div class="signature">
            Happy Birthday | &nbsp -W
        </div>
    </div>

    <script>
        let isRevealed = false;

        function revealMessage() {
            if (isRevealed) return; // Prevents double-clicking
            isRevealed = true;

            const seal = document.getElementById('seal');
            const message = document.getElementById('message');

            // 1. Hide the seal immediately
            seal.style.display = 'none';

            // 2. Show the message with a smooth reveal animation
            message.style.display = 'block';
            // Small timeout to ensure the display:block is rendered before animating
            setTimeout(() => {
                message.style.animation = "revealText 3s cubic-bezier(0.25, 1, 0.5, 1) forwards";
            }, 20);

            // 3. Trigger the Gold Dust Animation
            createGoldDust();
        }

        function createGoldDust() {
            const particleCount = 50; // Number of particles
            const body = document.body;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';

                // Randomize size (small and delicate)
                const size = Math.random() * 4 + 2 + 'px'; // between 2px and 6px
                particle.style.width = size;
                particle.style.height = size;

                // Randomize horizontal starting position
                particle.style.left = Math.random() * 100 + 'vw';

                // Randomize falling speed (between 3s and 8s)
                const duration = Math.random() * 5 + 3 + 's';
                particle.style.animationDuration = duration;

                // Randomize delay so they don't all start at once
                particle.style.animationDelay = Math.random() * 2 + 's';

                // Randomize horizontal drift amount for natural movement
                const drift = (Math.random() - 0.5) * 200 + 'px';
                particle.style.setProperty('--drift', drift);

                // Set the animation
                particle.style.animationName = 'fall-and-drift';
                particle.style.animationTimingFunction = 'linear';
                particle.style.animationIterationCount = '1'; // They fall once then disappear

                body.appendChild(particle);

                // Remove particle from DOM after animation ends to keep things clean
                setTimeout(() => {
                    particle.remove();
                }, parseFloat(duration) * 1000 + 2000);
            }
        }
    </script>

</body>
</html>
